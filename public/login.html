<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Foovox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0d">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: 24px; }
  form { background: var(--panel-veil); border: 1px solid var(--line); border-radius: 14px;
         padding: 24px; width: 100%; max-width: 380px; backdrop-filter: blur(12px); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p  { color: var(--dim); font-size: 13px; margin: 0 0 18px; }
  input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
          border-radius: 10px; padding: 12px 14px; font: 18px/1.2 ui-monospace, monospace;
          letter-spacing: 1px; text-align: center; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; margin-top: 12px; background: var(--accent); color: #fff; border: 0;
           border-radius: 10px; padding: 13px 14px; font: 600 15px inherit; cursor: pointer; }
  button[disabled] { opacity: .6; }
  .bad { color: var(--warn); font-size: 13px; margin-top: 12px; }
  .fine { color: var(--dim); font-size: 12px; margin: 18px 0 0; }
</style>
</head>
<body>
<form id="f">
  <h1>Sign in to Foovox</h1>
  <p id="lead">Enter the code you were sent. It works once, and only for you.</p>
  <input id="code" placeholder="pairing code" autocapitalize="off" autocorrect="off" spellcheck="false"
         inputmode="text" aria-label="Pairing code" autofocus>
  <button id="go" type="submit">Sign in</button>
  <p id="err" class="bad" hidden></p>
  <p class="fine">No code? Ask whoever invited you for another. Codes are
     single use, so a link that has already been opened will not work twice.</p>
</form>

<script type="module">
/*
 * Accept the code from the link, then strip it from the address bar.
 *
 * An invite is tapped once from a message; asking someone to copy a code out
 * and type it in is where they give up. But a credential in a URL sits in
 * history and rides along in any later Referer, so it is lifted into the field
 * and removed from the URL in the same breath. Not auto-submitted: a
 * redemption that fails on its own with no visible cause is worse than a tap.
 */
const url = new URL(location.href);
const supplied = url.searchParams.get('code');
if (supplied) {
  document.getElementById('code').value = supplied;
  document.getElementById('lead').textContent = 'Your code is filled in below. Tap Sign in.';
  url.searchParams.delete('code');
  history.replaceState({}, '', url.pathname + url.search);
}

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const code = document.getElementById('code').value.trim();
  if (!code) return;
  const go = document.getElementById('go');
  const err = document.getElementById('err');
  go.disabled = true;
  go.textContent = 'Signing in…';
  err.hidden = true;
  try {
    const res = await fetch('/api/auth/redeem', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // same-origin so the Set-Cookie is stored; the page never sees the token
      credentials: 'same-origin',
      body: JSON.stringify({ code }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      // 429 is rate limiting, not a wrong code. Say which, or they keep
      // retrying a code that was fine.
      err.textContent = res.status === 429
        ? 'Too many attempts. Wait a few minutes and try again.'
        : (body.error ?? `Sign in failed (${res.status})`);
      err.hidden = false;
      go.disabled = false;
      go.textContent = 'Sign in';
      return;
    }
    location.href = '/';
  } catch (e) {
    err.textContent = e.message;
    err.hidden = false;
    go.disabled = false;
    go.textContent = 'Sign in';
  }
};
</script>
</body>
</html>
